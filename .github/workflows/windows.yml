name: windows

on:
  push:
    branches: ['**']
    tags: ['v*']  # a v* tag also publishes the installer as a GitHub Release
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build, test, package
        shell: pwsh
        run: windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: KazType-windows
          path: windows/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: KazType-Setup
          path: windows/dist/KazType-Setup-*.exe
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem windows/dist/KazType-Setup-*.exe).FullName --generate-notes
