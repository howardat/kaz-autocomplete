# A v* tag builds both installers and publishes them as one GitHub Release.
name: release

on:
  push:
    tags: ['v*']

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  macos:
    uses: ./.github/workflows/macos.yml
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KazType-Setup
      - uses: actions/download-artifact@v4
        with:
          name: KazType-macOS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" KazType-Setup-*.exe KazType-*.pkg --generate-notes --repo "$GITHUB_REPOSITORY"
